name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site

          cp -R site _site/site
          mkdir -p _site/gge-tracker/gge-tracker-frontend/src
          cp -R gge-tracker/gge-tracker-frontend/src/assets _site/gge-tracker/gge-tracker-frontend/src/assets

          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=site/">
              <link rel="canonical" href="site/">
              <title>Empire Birds</title>
              <script>
                location.replace("site/" + location.search + location.hash);
              </script>
            </head>
            <body>
              <a href="site/">Open Empire Birds</a>
            </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
